{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="subtitle">AI-Assisted Personal Money Management System</p>
    <form method="POST">
      <label>Username
        <input type="text" name="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="primary">Log in</button>
    </form>
    <p class="switch-link">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
