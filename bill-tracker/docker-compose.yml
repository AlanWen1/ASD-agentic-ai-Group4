services:
  ai-mode-service:
    build: ../ai-services/ai-mode
    container_name: ai-mode-service
    ports:
      - "5099:5099"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  database:
    build: ./database
    container_name: bill-tracker-database
    ports:
      - "6004:6004"
    volumes:
      - bill_data:/data
    environment:
      - DATABASE_PATH=/data/bills.db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bill-tracker-backend
    ports:
      - "5004:5004"
    environment:
      - DATABASE_URL=http://database:6004
      - AUTH_DATABASE_URL=http://host.docker.internal:6000
      - OLLAMA_URL=http://ai-mode-service:5099
      - OLLAMA_MODEL=qwen2.5:0.5b
    depends_on:
      - database
      - ai-mode-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bill-tracker-frontend
    ports:
      - "3004:3004"
    environment:
      - BACKEND_URL=http://backend:5004
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bill_data:
