services:
  student-3-database:
    build: ./student-3/database
    container_name: student-3-database
    environment:
      DATABASE_PATH: /data/student-3-income.db
    ports:
      - "6003:6003"
    volumes:
      - student-3-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6003/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  student-3-backend:
    build: ./student-3/backend
    container_name: student-3-backend
    environment:
      DATABASE_SERVICE_URL: http://student-3-database:6003
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-http://host.docker.internal:6000}
      OLLAMA_BASE_URL: http://host.docker.internal:5099/v1
      MCP_SERVER_URL: http://host.docker.internal:5100/mcp
      RAG_SERVER_URL: http://host.docker.internal:5101
      AI_ENABLED: ${AI_ENABLED:-true}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_TIMEOUT_SECONDS: 90
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5003:5003"
    depends_on:
      student-3-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  student-3-frontend:
    build:
      context: .
      dockerfile: student-3/frontend/Dockerfile
    container_name: student-3-frontend
    environment:
      BACKEND_SERVICE_URL: http://student-3-backend:5003
    ports:
      - "3003:3003"
    depends_on:
      student-3-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  student-3-data:
