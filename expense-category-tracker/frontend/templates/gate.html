<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in required</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="shell">
        <div class="auth-card" style="text-align:center">
            <p class="brand">Expense &amp; Category Manager</p>
            <h1>Sign in required</h1>
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <p>Open the Expense &amp; Category Manager from the Finance Application home page.</p>
            <a href="{{ finance_url }}" class="button-link" style="margin-top:12px">Return to Finance Application</a>
        </div>
    </div>
</body>
</html>
