services:
  ai-mode-service:
    build: ./ai-services/ai-mode
    container_name: ai-mode-service
    ports:
      - "5099:5099"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  finance-database:
    build: ./finance-application/database
    container_name: finance-application-database
    ports:
      - "6000:6000"
    volumes:
      - finance_data:/data
    environment:
      - DATABASE_PATH=/data/finance.db
    restart: unless-stopped

  finance-backend:
    build: ./finance-application/backend
    container_name: finance-application-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=http://finance-database:6000
      - BILL_DATABASE_URL=http://bill-database:6004
    depends_on:
      - finance-database
      - bill-database
    restart: unless-stopped

  finance-frontend:
    build: ./finance-application/frontend
    container_name: finance-application-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://finance-backend:5000
    depends_on:
      - finance-backend
    restart: unless-stopped

  bill-database:
    build: ./bill-tracker/database
    container_name: bill-tracker-database
    ports:
      - "6004:6004"
    volumes:
      - bill_data:/data
    environment:
      - DATABASE_PATH=/data/bills.db
    restart: unless-stopped

  bill-backend:
    build: ./bill-tracker/backend
    container_name: bill-tracker-backend
    ports:
      - "5004:5004"
    environment:
      - DATABASE_URL=http://bill-database:6004
      - AUTH_DATABASE_URL=http://finance-database:6000
      - OLLAMA_URL=http://ai-mode-service:5099
      - OLLAMA_MODEL=qwen2.5:0.5b
    depends_on:
      - bill-database
      - finance-database
      - ai-mode-service
    restart: unless-stopped

  bill-frontend:
    build: ./bill-tracker/frontend
    container_name: bill-tracker-frontend
    ports:
      - "3004:3004"
    environment:
      - BACKEND_URL=http://bill-backend:5004
    depends_on:
      - bill-backend
    restart: unless-stopped

  savings-database:
    build: ./student-5/database
    container_name: savings-goal-database
    ports:
      - "6005:6005"
    volumes:
      - savings_data:/data
    environment:
      - DATABASE_PATH=/data/savings.db
    restart: unless-stopped

  savings-backend:
    build: ./student-5/backend
    container_name: savings-goal-backend
    ports:
      - "5005:5005"
    environment:
      - DATABASE_API_URL=http://savings-database:6005
      - OLLAMA_API_URL=http://ai-mode-service:5099/api/generate
      - OLLAMA_MODEL=qwen2.5:0.5b
    depends_on:
      - savings-database
      - ai-mode-service
  expense-database:
    build: ./expense-category-tracker/database
    container_name: expense-tracker-database
    ports:
      - "6002:6002"
    volumes:
      - expense_data:/data
    environment:
      - DATABASE_PATH=/data/expenses.db
    restart: unless-stopped

  expense-backend:
    build: ./expense-category-tracker/backend
    container_name: expense-tracker-backend
    ports:
      - "5002:5002"
    environment:
      - AUTH_DATABASE_URL=http://finance-database:6000
      - DATABASE_URL=http://expense-database:6002
      - OLLAMA_URL=http://ai-mode-service:5099
      - OLLAMA_MODEL=qwen2.5:0.5b
    depends_on:
      - finance-database
      - expense-database
      - ai-mode-service
    restart: unless-stopped

  savings-frontend:
    build:
      context: .
      dockerfile: student-5/frontend/Dockerfile
    container_name: savings-goal-frontend
    ports:
      - "3005:3005"
    environment:
      - BACKEND_API_URL=http://savings-backend:5005
    depends_on:
      - savings-backend
  expense-frontend:
    build:
      context: .
      dockerfile: expense-category-tracker/frontend/Dockerfile
    container_name: expense-tracker-frontend
    ports:
      - "3002:3002"
    environment:
      - BACKEND_URL=http://expense-backend:5002
    depends_on:
      - expense-backend
    restart: unless-stopped

  student-3-database:
    build: ./student-3/database
    container_name: student-3-database
    ports:
      - "6003:6003"
    volumes:
      - student_3_data:/data
    environment:
      - DATABASE_PATH=/data/student-3-income.db
    restart: unless-stopped

  student-3-backend:
    build: ./student-3/backend
    container_name: student-3-backend
    ports:
      - "5003:5003"
    environment:
      - DATABASE_SERVICE_URL=http://student-3-database:6003
      - AUTH_DATABASE_URL=http://finance-database:6000
      - OLLAMA_BASE_URL=http://ai-mode-service:5099/v1
      - OLLAMA_MODEL=qwen2.5:0.5b
      - OLLAMA_TIMEOUT_SECONDS=90
    depends_on:
      - finance-database
      - student-3-database
      - ai-mode-service
    restart: unless-stopped

  student-3-frontend:
    build:
      context: .
      dockerfile: student-3/frontend/Dockerfile
    container_name: student-3-frontend
    ports:
      - "3003:3003"
    environment:
      - BACKEND_SERVICE_URL=http://student-3-backend:5003
    depends_on:
      - student-3-backend
    restart: unless-stopped

  budget-database-init:
    build: ./student-1-budget/database
    container_name: student-1-budget-database-init
    volumes:
      - ./student-1-budget/database:/app/database
    restart: "no"

  budget-backend:
    build: ./student-1-budget/backend
    container_name: student-1-budget-backend
    ports:
      - "5001:5001"
    volumes:
      - ./student-1-budget/database:/app/database
    environment:
      - DATABASE_PATH=/app/database/budget_manager.db
      - OLLAMA_URL=http://ai-mode-service:5099
      - OLLAMA_MODEL=qwen2.5:0.5b
    depends_on:
      budget-database-init:
        condition: service_completed_successfully
      ai-mode-service:
        condition: service_started
    restart: unless-stopped

  budget-frontend:
    build:
      context: .
      dockerfile: student-1-budget/frontend/Dockerfile
    container_name: student-1-budget-frontend
    ports:
      - "3001:5000"
    environment:
      - BACKEND_URL=http://budget-backend:5001
    depends_on:
      - budget-backend
    restart: unless-stopped

volumes:
  finance_data:
    name: finance-application-finance-data

  bill_data:
    name: finance-application-bill-data

  expense_data:
    name: finance-application-expense-data

  student_3_data:
    name: finance-application-student-3-data
    
  savings_data:
    name: finance-application-savings-data