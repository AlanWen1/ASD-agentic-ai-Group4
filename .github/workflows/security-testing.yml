name: Local Pre-Commit Security Testing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-security:
    name: Ruff S rules, detect-secrets and pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Execute changed-file security hooks and full dependency audit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_REF="$PR_BASE_SHA"
          else
            BASE_REF="$EVENT_BEFORE"
          fi
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            BASE_REF="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$BASE_REF" ]]; then
            pre-commit run --from-ref "$BASE_REF" --to-ref "$COMMIT_SHA" --show-diff-on-failure 2>&1 | tee security-testing-output.txt
          else
            pre-commit run --all-files --show-diff-on-failure 2>&1 | tee security-testing-output.txt
          fi

      - name: Upload security test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-commit-security-test-output
          path: security-testing-output.txt
          if-no-files-found: warn