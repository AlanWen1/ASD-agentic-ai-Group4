name: Local Pre-Commit Security Testing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-security:
    name: Ruff S rules, detect-secrets and pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Execute full-repository security hooks and dependency audit
        shell: bash
        run: |
          set -euo pipefail
          pre-commit run --all-files --show-diff-on-failure 2>&1 | tee security-testing-output.txt

      - name: Upload security test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-commit-security-test-output
          path: security-testing-output.txt
          if-no-files-found: warn