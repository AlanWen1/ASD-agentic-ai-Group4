name: Shared Multi-Agent Server CI

on:
  push:
    branches: [ main, release-2-multi-agent ]
    paths:
      - 'ai-services/multi-agent-server/**'
      - '.github/workflows/multi-agent-server.yml'
  pull_request:
    paths:
      - 'ai-services/multi-agent-server/**'
      - '.github/workflows/multi-agent-server.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/multi-agent-server/requirements.txt
      - name: Install service and test dependencies
        run: |
          python -m pip install -r ai-services/multi-agent-server/requirements.txt
          python -m pip install pytest
      - name: Compile-check server and client
        run: python -m compileall -q ai-services/multi-agent-server
      - name: Run mocked workflow tests
        working-directory: ai-services/multi-agent-server
        run: python -m pytest tests -q