name: Shared Multi-Agent Server CI

on:
  push:
    branches: [main, feature/student-3-release-2-final, feature/student-3-release-2-bonus]
    paths:
      - 'ai-services/**'
      - '.github/workflows/multi-agent-server.yml'
  pull_request:
    paths:
      - 'ai-services/**'
      - '.github/workflows/multi-agent-server.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/multi-agent-server/requirements.txt
      - name: Install service and test dependencies
        run: |
          python -m pip install -r ai-services/multi-agent-server/requirements.txt
          python -m pip install pytest -r ai-services/mcp-server/requirements.txt
      - name: Compile-check server and client
        run: python -m compileall -q ai-services/multi-agent-server
      - name: Run mocked workflow tests
        working-directory: ai-services/multi-agent-server
        run: python -m pytest tests -q
      - name: Verify retained AI-Mode service
        working-directory: ai-services/ai-mode
        run: python -m pytest tests -q
      - name: Verify retained MCP tool contracts
        working-directory: ai-services/mcp-server
        run: python -m pytest tests -q
      - name: Verify retained RAG pipeline
        working-directory: ai-services/rag-server
        run: python -m pytest tests -q
