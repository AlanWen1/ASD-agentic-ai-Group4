name: Release 2 Azure Cloud Deployment

on:
  push:
    branches: [main, feature/student-3-release-2-final, feature/student-3-release-2-bonus]
    paths:
      - "finance-application/**"
      - "student-1-budget/**"
      - "expense-category-tracker/**"
      - "student-3/**"
      - "bill-tracker/**"
      - "student-5/**"
      - "docker-compose.yml"
      - "scripts/deploy/**"
      - "ai-services/**"
      - ".pre-commit-config.yaml"
      - "scripts/security/**"
      - ".github/workflows/cloud-deployment.yml"
  pull_request:
    branches: [main, feature/student-3-release-2-final, feature/student-3-release-2-bonus]
    paths:
      - "finance-application/**"
      - "student-1-budget/**"
      - "expense-category-tracker/**"
      - "student-3/**"
      - "bill-tracker/**"
      - "student-5/**"
      - "docker-compose.yml"
      - "scripts/deploy/**"
      - "ai-services/**"
      - ".pre-commit-config.yaml"
      - "scripts/security/**"
      - ".github/workflows/cloud-deployment.yml"
  workflow_dispatch:
    inputs:
      ai_profile:
        description: Baseline keeps every AI feature disabled; bonus enables all four
        type: choice
        options: [baseline, bonus]
        default: baseline

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: azure-release2
  cancel-in-progress: false

env:
  AI_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"

jobs:
  validate:
    name: Integrated CI validation (AI services disabled)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security hooks and audit the whole repository
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
      - name: Compile all Python modules
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          roots = ["finance-application", "student-1-budget", "expense-category-tracker", "student-3", "bill-tracker", "student-5"]
          files = [p for root in roots for p in pathlib.Path(root).rglob("*.py") if ".venv" not in p.parts]
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failures.append(f"{path}: {exc}")
          print(f"Compiled {len(files) - len(failures)}/{len(files)} Python files")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Install module test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r student-1-budget/backend/requirements.txt
          python -m pip install -r expense-category-tracker/backend/requirements.txt
          python -m pip install -r student-3/backend/requirements.txt
          python -m pip install -r bill-tracker/backend/requirements.txt
      - name: Run all five students' post-commit endpoint tests
        run: |
          set -e
          for test in \
            student-1-budget/backend/test_post_commit_endpoints.py \
            expense-category-tracker/backend/tests/test_post_commit_endpoints.py \
            student-3/tests/test_post_commit_endpoints.py \
            bill-tracker/backend/test_post_commit_endpoints.py \
            student-5/tests/test_post_commit_endpoints.py; do
            if [ ! -f "$test" ]; then
              echo "::error::Required endpoint test file is missing: $test"
              exit 1
            fi
            python -m pytest -q "$test"
          done
      - name: Validate Student 3, review modes and Multi-Agent boundaries
        run: |
          python -m pytest -q student-3/tests ai-services/agentic-loop/tests
          python -m pytest -q ai-services/multi-agent-server/tests scripts/deploy/tests
          python -m pytest -q finance-application/frontend/tests student-1-budget/database/tests
      - name: Validate Compose configuration with AI services disabled
        run: docker compose config --quiet

      - name: Start the integrated baseline Compose stack
        run: docker compose up --build -d
      - name: Verify shared login, all five modules and user isolation over HTTP
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          path = Path("/tmp/baseline-deployment.json")
          path.write_text(json.dumps({"profile":"baseline", "environment":"docker-compose-ci", "frontends": {
              name: f"http://localhost:{3000+i}" for i, name in enumerate(
                  ["finance", "budget", "expense", "income", "bill", "savings"])}}))
          PYCODE
          python scripts/deploy/cloud_smoke.py --deployment /tmp/baseline-deployment.json --output docs/release-2/evidence/ci/integrated-compose.json
      - name: Upload integrated container test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-compose-tests
          path: docs/release-2/evidence/ci/
          if-no-files-found: warn
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 30
      - name: Clean up runner test containers
        if: always()
        run: docker compose down --volumes

  deploy:
    name: Build and deploy integrated app to Azure Container Apps
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/student-3-release-2-final' || github.ref == 'refs/heads/feature/student-3-release-2-bonus'))
    needs: validate
    env:
      CLOUD_AI_PROFILE: ${{ inputs.ai_profile || (endsWith(github.ref, '-bonus') && 'bonus') || 'baseline' }}
      IMAGE_TAG: ${{ github.sha }}
    runs-on: ubuntu-latest
    environment: azure-release2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deployment verification dependency
        run: python -m pip install requests
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Wait for earlier deployments to the shared Azure environment
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: python scripts/deploy/wait_for_previous_deployment.py
      - name: Configure deployment environment
        shell: bash
        run: |
          echo "AZURE_RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }}" >> "$GITHUB_ENV"
          echo "AZURE_LOCATION=${{ vars.AZURE_LOCATION }}" >> "$GITHUB_ENV"
          echo "AZURE_CONTAINER_REGISTRY=${{ vars.AZURE_CONTAINER_REGISTRY }}" >> "$GITHUB_ENV"
          echo "AZURE_CONTAINERAPPS_ENVIRONMENT=${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}" >> "$GITHUB_ENV"
          echo "AZURE_STORAGE_ACCOUNT=${{ vars.AZURE_STORAGE_ACCOUNT }}" >> "$GITHUB_ENV"
      - name: Install/update Azure Container Apps CLI support
        run: az extension add --name containerapp --upgrade
      - name: Deploy
        run: bash scripts/deploy/azure-deploy.sh
      - name: Upload real cloud validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-${{ env.CLOUD_AI_PROFILE }}-${{ github.sha }}
          path: docs/release-2/evidence/cloud/
          if-no-files-found: warn
      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Azure Release 2 deployment"
            echo "- Validation job: ${{ needs.validate.result }}"
            echo "- Deployment job: ${{ job.status }}"
            echo "- Resource group: ${{ vars.AZURE_RESOURCE_GROUP }}"
            echo "- Location: ${{ vars.AZURE_LOCATION }}"
            echo "- Cloud AI profile: $CLOUD_AI_PROFILE"
          } >> "$GITHUB_STEP_SUMMARY"
