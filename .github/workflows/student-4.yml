name: Student 4 - Bills Manager CI

on:
  push:
    paths:
      - "bill-tracker/**"
      - ".github/workflows/student-4.yml"

  pull_request:
    paths:
      - "bill-tracker/**"
      - ".github/workflows/student-4.yml"

  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: bill-tracker
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pytest

      - name: Check Python syntax
        working-directory: bill-tracker
        run: |
          python -m compileall frontend backend database

      - name: Validate Docker Compose
        working-directory: bill-tracker
        run: |
          docker compose config

      - name: Build frontend
        run: |
          docker build \
            -t bill-tracker-frontend:test \
            ./bill-tracker/frontend

      - name: Build backend
        run: |
          docker build \
            -t bill-tracker-backend:test \
            ./bill-tracker/backend

      - name: Build database
        run: |
          docker build \
            -t bill-tracker-database:test \
            ./bill-tracker/database

      - name: Build complete application
        working-directory: bill-tracker
        run: |
          docker compose build

      - name: Post-commit endpoint tests (bills collection and summary)
        working-directory: bill-tracker/backend
        run: pytest -q test_post_commit_endpoints.py --junitxml=post-commit-student-4.xml

      - name: Upload Student 4 endpoint test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-commit-student-4
          path: "**/post-commit-student-4.xml"
          if-no-files-found: warn
