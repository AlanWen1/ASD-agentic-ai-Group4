name: Student 1 - Budget Manager CI

on:
  push:
    branches: [ main, budget-vishal, budget-mcp ]
    paths:
      - 'student-1-budget/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'student-1-budget/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1.yml'
  workflow_dispatch:

# AI-Mode, MCP and RAG integration is retained in the code but disabled during CI/CD.
# docker compose passes these into budget-backend (see docker-compose.yml).
env:
  AI_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            student-1-budget/backend/requirements.txt
            student-1-budget/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r student-1-budget/backend/requirements.txt
          pip install -r student-1-budget/requirements-dev.txt

      - name: Compile-check Python source
        run: python -m compileall -q student-1-budget

      - name: Validate root Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and start finance-database, budget-database and budget-backend
        run: docker compose up -d --build finance-database budget-database budget-backend

      - name: Wait for services
        run: |
          wait_for() {  # wait_for <name> <url>: fail if nothing answers in 60s
            for i in $(seq 1 60); do
              curl -s -o /dev/null "$2" && echo "$1 is up" && return 0
              sleep 1
            done
            echo "$1 did not start at $2" && exit 1
          }
          wait_for finance-database http://localhost:6000/
          wait_for budget-database http://localhost:6001/api/health
          wait_for budget-backend http://localhost:5001/api/health

      - name: Verify AI-Mode, MCP and RAG are disabled
        run: |
          curl -s http://localhost:5001/api/health | tee /tmp/health.json
          echo
          grep -q '"ai": *"disabled"' /tmp/health.json
          grep -q '"mcp": *"disabled"' /tmp/health.json
          grep -q '"rag": *"disabled"' /tmp/health.json
          echo "AI-Mode, MCP and RAG integration retained but disabled for CI/CD"

      - name: Run Student 1 API tests
        working-directory: student-1-budget
        run: pytest tests/test_budget_api.py -v

      - name: Build frontend image
        run: docker compose build budget-frontend

      - name: Show logs on failure
        if: failure()
        run: docker compose logs finance-database budget-database budget-backend || true