name: Student 3 - Income Manager

on:
  push:
    paths:
      - "student-3/**"
      - "requirements-dev.txt"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - "docker-compose.student-3.yml"
      - ".github/workflows/student-3.yml"
  pull_request:
    paths:
      - "student-3/**"
      - "requirements-dev.txt"
      - "ai-services/agentic-loop/**"
      - "docker-compose.yml"
      - "docker-compose.student-3.yml"
      - ".github/workflows/student-3.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student-3/frontend/requirements.txt
            student-3/backend/requirements.txt
            student-3/database/requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt -r student-3/backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python source
        run: python -m compileall -q student-3 ai-services/agentic-loop

      - name: Run Student 3 tests
        run: pytest -q student-3/tests ai-services/agentic-loop/tests

      - name: Test frontend response rendering
        run: node --test student-3/tests/test_frontend_rendering.cjs

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.student-3.yml config --quiet

      - name: Build and start Student 3 with shared authentication
        run: docker compose up --build -d finance-database student-3-database student-3-backend student-3-frontend

      - name: Test frontend, backend and database integration without AI services
        run: python student-3/scripts/ci_smoke.py

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color finance-database student-3-database student-3-backend student-3-frontend

      - name: Clean up runner containers and test data
        if: always()
        run: docker compose down --volumes
