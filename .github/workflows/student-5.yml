name: Student 5 CI

on:
  push:
    branches:
      - student-5-savings-goal
  pull_request:
    branches:
      - main

jobs:
  student-5-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pytest

      - name: Check Python syntax
        run: |
          python -m py_compile student-5/database/app.py
          python -m py_compile student-5/backend/app.py
          python -m py_compile student-5/backend/agent.py
          python -m py_compile student-5/frontend/app.py

      - name: Run Student 5 tests
        run: |
          python -m pytest student-5/tests/test_ci.py -v

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Student 5 Docker images
        run: |
          docker compose build savings-database savings-backend savings-frontend