name: Student 2 - Expense & Category Manager CI

on:
  push:
    paths:
      - "expense-category-tracker/**"
      - "docker-compose.yml"
      - ".github/workflows/student-2.yml"
  pull_request:
    paths:
      - "expense-category-tracker/**"
      - "docker-compose.yml"
      - ".github/workflows/student-2.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Release 1: AI-Mode, MCP and RAG stay integrated in the code but are
    # disabled during CI/CD. The shared local servers are never started
    # here, and the MCP/RAG route tests run against mocks only.
    env:
      AI_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            expense-category-tracker/backend/requirements.txt
            expense-category-tracker/frontend/requirements.txt
            expense-category-tracker/database/requirements.txt

      - name: Install dependencies
        working-directory: expense-category-tracker
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt
          pip install -r database/requirements.txt
          pip install pytest

      - name: Compile-check Python source
        run: python -m compileall -q expense-category-tracker

      - name: Run backend tests
        working-directory: expense-category-tracker/backend
        run: pytest tests -v

      - name: Run frontend tests
        working-directory: expense-category-tracker/frontend
        run: pytest tests -v

      - name: Run database tests
        working-directory: expense-category-tracker/database
        run: pytest tests -v

      - name: Post-commit endpoint tests (categories and expenses)
        working-directory: expense-category-tracker/backend
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_post_commit_endpoints.py --junitxml=post-commit-student-2.xml

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Student 2 containers
        run: |
          docker build -t expense-tracker-database ./expense-category-tracker/database
          docker build -t expense-tracker-backend ./expense-category-tracker/backend
          docker build -t expense-tracker-frontend:test -f expense-category-tracker/frontend/Dockerfile .

      - name: Upload Student 2 endpoint test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-commit-student-2
          path: "**/post-commit-student-2.xml"
          if-no-files-found: warn
