# Standalone compose file for testing YOUR module in isolation
# (frontend + backend + a local Ollama instance).
#
# This is NOT the team's shared docker-compose.yml — once your module
# works here, hand this service definition to whoever is assembling the
# team's root docker-compose.yml so it can be merged in alongside
# everyone else's frontend/backend services and the team's shared
# ai-services/ai-mode Ollama container.
#
# Run with:  docker compose -f docker-compose.student2.yml up --build

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
      - DB_PATH=/data/expenses.db
    volumes:
      - backend_data:/data
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "5001:5000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  ollama_data:
  backend_data:
